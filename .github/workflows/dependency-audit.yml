name: Dependency audit

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'

# Audit errors and all findings outside the exact, expiring DEV-087 waiver fail.
# DEV-087 records the owner's decision and the outstanding toolchain advisory.
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.12.16'
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Evaluate complete audit with exact temporary waiver
        run: python -m scripts.check_frontend_audit --report "$RUNNER_TEMP/npm-audit.json"
      - name: Retain unmodified audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dependency-audit
          path: ${{ runner.temp }}/npm-audit.json
          retention-days: 14
          if-no-files-found: warn
