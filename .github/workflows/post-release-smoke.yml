name: Validate Published Install Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Bowl Bound release tag to download and validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            target: macos-arm64
            kind: portable
          - os: macos-26-intel
            arch: x64
            target: macos-x86_64
            kind: portable
          - os: windows-2025
            arch: x64
            target: windows-x64
            kind: portable
          - os: windows-2025
            arch: x64
            target: windows-x64
            kind: installer
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      TARGET: ${{ matrix.target }}
      KIND: ${{ matrix.kind }}
      GH_TOKEN: ${{ github.token }}
      PYTHONNOUSERSITE: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.17'
          architecture: ${{ matrix.arch }}
      - name: Check out immutable release source catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}
          path: release-source
      - name: Install browser harness only (no source application)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Download published artifact and its release identity
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          mkdir -p "$RUNNER_TEMP/published-download" "$RUNNER_TEMP/install-validation"
          ARTIFACT_VERSION="${RELEASE_TAG#v}"
          if [[ "$KIND" == installer ]]; then
            ASSET_NAME="BowlBoundSetup-$ARTIFACT_VERSION-$TARGET.exe"
          else
            ASSET_NAME="BowlBound-$ARTIFACT_VERSION-$TARGET.zip"
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/published-download/release.json"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET_NAME" --pattern "$ASSET_NAME.sha256" --dir "$RUNNER_TEMP/published-download"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
      - name: Validate downloaded application with API and rendered browser checks
        run: |
          python -m scripts.validate_install_artifact --artifact "$RUNNER_TEMP/published-download/$ASSET_NAME" --release-json "$RUNNER_TEMP/published-download/release.json" --tag "$RELEASE_TAG" --target "$TARGET" --report "$RUNNER_TEMP/install-validation/receipt.json" --catalog-manifest release-source/release/manifest.json
      - name: Retain success and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-validation-${{ matrix.target }}-${{ matrix.kind }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/install-validation/receipt.json
            ${{ runner.temp }}/install-validation/server.log
            ${{ runner.temp }}/install-validation/browser.png
            ${{ runner.temp }}/published-download/release.json
          if-no-files-found: warn
          retention-days: 14
