name: Build and Release Standalone Executables

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Full approved main commit SHA to build (defaults to dispatch commit)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.16'
  NODE_VERSION: '24.22.1'
  PYTHONNOUSERSITE: '1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      source_ref: ${{ steps.verify.outputs.source_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require successful exact-commit main push validation
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
          SOURCE_REF: ${{ inputs.source_ref || github.sha }}
        run: python -m scripts.verify_source_gate

  build:
    env:
      PYTHON_VERSION: '3.12.10'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            target: macos-arm64
          - os: windows-2025
            arch: x64
            target: windows-x64
          - os: macos-15-intel
            arch: x64
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.test.outputs.source_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Create isolated native build environment
        run: |
          python -m venv "$RUNNER_TEMP/native-env"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "BUILD_PYTHON=$RUNNER_TEMP/native-env/Scripts/python.exe" >> "$GITHUB_ENV"
          else
            echo "BUILD_PYTHON=$RUNNER_TEMP/native-env/bin/python" >> "$GITHUB_ENV"
          fi
      - name: Install exact build and runtime graph (never editable project)
        run: |
          "$BUILD_PYTHON" -m pip install --only-binary=:all: --no-deps -r release/requirements-native.txt
          "$BUILD_PYTHON" -m pip check
      - name: Stage approved sources and build portable app
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          "$BUILD_PYTHON" -m scripts.build_standalone --target "$BUILD_TARGET" --output "$RUNNER_TEMP/bowl-bound-artifacts"
      - name: Smoke verified extracted executable
        run: '"$BUILD_PYTHON" -m scripts.smoke_standalone "$RUNNER_TEMP/bowl-bound-artifacts"'
      - name: Build and smoke macOS disk image
        if: startsWith(matrix.target, 'macos-')
        run: |
          for archive in "$RUNNER_TEMP/bowl-bound-artifacts/"*.zip; do
            "$BUILD_PYTHON" -m scripts.macos_dmg "$archive" --smoke
          done
      - name: Check out failed-launch diagnostic tools
        if: failure() && startsWith(matrix.target, 'macos-')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .native-diagnostics
      - name: Capture failed Finder launch evidence
        if: failure() && startsWith(matrix.target, 'macos-')
        env:
          SOURCE_REF: ${{ needs.test.outputs.source_ref }}
          WORKFLOW_REF: ${{ github.sha }}
        run: |
          "$BUILD_PYTHON" .native-diagnostics/scripts/macos_finder_diagnostics.py \
            --output "$RUNNER_TEMP/bowl-bound-artifacts/finder-diagnostics" \
            --source-ref "$SOURCE_REF" --workflow-ref "$WORKFLOW_REF"
      - name: Retain unqualified macOS failure resources
        if: failure() && startsWith(matrix.target, 'macos-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BowlBound-unqualified-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bowl-bound-artifacts/finder-diagnostics/
            ${{ runner.temp }}/bowl-bound-artifacts/*.zip
            ${{ runner.temp }}/bowl-bound-artifacts/*.sha256
            ${{ runner.temp }}/bowl-bound-artifacts/*.manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Install pinned Windows installer compiler
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          choco upgrade nsis --version=3.11 --allow-downgrade --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile installer and test installed app and uninstall
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          & $env:BUILD_PYTHON -m scripts.windows_installer "$env:RUNNER_TEMP/bowl-bound-artifacts" --makensis "${env:ProgramFiles(x86)}/NSIS/makensis.exe" --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload inspected build artifacts (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BowlBound-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bowl-bound-artifacts/*.zip
            ${{ runner.temp }}/bowl-bound-artifacts/*.sha256
            ${{ runner.temp }}/bowl-bound-artifacts/*.manifest.json
            ${{ runner.temp }}/bowl-bound-artifacts/*.exe
            ${{ runner.temp }}/bowl-bound-artifacts/*.dmg
            ${{ runner.temp }}/bowl-bound-artifacts/*.receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Retain native verification receipts and failed Windows dialog logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BowlBound-verification-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bowl-bound-artifacts/*.receipt.json
            ${{ runner.temp }}/bowl-bound-artifacts/bb-native-smoke-*/windows-terms-*.log
            ${{ runner.temp }}/bowl-bound-artifacts/bb-native-smoke-*/windows-runtime-terms-gui.json
            ${{ runner.temp }}/bowl-bound-artifacts/bb-install-smoke-*/failure.json
            ${{ runner.temp }}/bowl-bound-artifacts/bb-install-smoke-*/windows-terms-*.log
            ${{ runner.temp }}/bowl-bound-artifacts/bb-install-smoke-*/windows-runtime-terms-gui.json
          if-no-files-found: warn
          retention-days: 14
