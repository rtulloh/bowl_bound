[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bowl_bound"
version = "0.1.0a1"
description = "A Python implementation of the Bowl Bound college-football board game"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5",
    "pytest-cov>=4.0",
    "reportlab>=4.0",
    "pdfplumber>=0.11,<0.12",
    "fastapi>=0.110",
    "httpx2>=2.0",
]

pdf = ["pdfplumber>=0.11,<0.12"]
web = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
bowl-bound-import = "tools.pdf_import.cli:main"
bowl-bound = "bowl_bound.cli:main"

[tool.setuptools.packages.find]
include = ["bowl_bound*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["bowl_bound", "tools", "backend"]
branch = true

[tool.coverage.report]
# Project floor for the full-suite gate; run with `pytest --cov`.
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
